<svg width="1280" height="280" viewBox="0 0 1280 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tactical Chess Engine &amp; Strategy Matrix</title>
  <desc id="desc">Animated holographic chessboard illustrating calculated architectural strategy</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgChess" x1="0" y1="0" x2="1280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#071329"/>
      <stop offset="100%" stop-color="#0A0618"/>
    </linearGradient>

    <!-- Neon Spectrum Accent -->
    <linearGradient id="chessSpectrum" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="65%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="chessGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="chessClip"><rect width="1280" height="280" rx="22"/></clipPath>
    <clipPath id="boardClip"><rect x="0" y="0" width="224" height="224" rx="10"/></clipPath>
  </defs>

  <!-- Frame Background -->
  <g clip-path="url(#chessClip)">
    <rect width="1280" height="280" fill="url(#bgChess)"/>
    <circle cx="1000" cy="140" r="160" fill="#38BDF8" opacity="0.04">
      <animate attributeName="r" values="140;180;140" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="1.5" y="1.5" width="1277" height="277" rx="21" stroke="url(#chessSpectrum)" stroke-opacity="0.32" stroke-width="2"/>

  <!-- Left Side: Strategy & Architectural Philosophy -->
  <g transform="translate(48, 38)">
    <text y="14" fill="#38BDF8" font-family="Consolas, monospace" font-size="12" font-weight="800" letter-spacing="2.5">STRATEGY_CORE // TACTICAL ARCHITECTURE</text>
    <text y="52" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" letter-spacing="-0.5">
      Always Thinking <tspan fill="#38BDF8">5 Moves Ahead</tspan>
    </text>
    <text y="82" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">
      Treating system architecture like a grandmaster game: calculated trade-offs, zero blunders.
    </text>

    <!-- Live Game Metrics -->
    <g transform="translate(0, 110)">
      <g transform="translate(0, 0)">
        <rect width="136" height="30" rx="8" fill="#082F49" stroke="#0EA5E9" stroke-width="1"/>
        <text x="68" y="19" text-anchor="middle" fill="#BAE6FD" font-family="Consolas, monospace" font-size="10" font-weight="700">DEPTH: 32 PLIES</text>
      </g>
      <g transform="translate(148, 0)">
        <rect width="136" height="30" rx="8" fill="#25164A" stroke="#8B5CF6" stroke-width="1"/>
        <text x="68" y="19" text-anchor="middle" fill="#DDD6FE" font-family="Consolas, monospace" font-size="10" font-weight="700">ACCURACY: 99.1%</text>
      </g>
      <g transform="translate(296, 0)">
        <rect width="136" height="30" rx="8" fill="#06372E" stroke="#22C55E" stroke-width="1"/>
        <text x="68" y="19" text-anchor="middle" fill="#DCFCE7" font-family="Consolas, monospace" font-size="10" font-weight="700">EVAL: +3.45 [WIN]</text>
      </g>
    </g>

    <!-- Move Log Terminal -->
    <g transform="translate(0, 162)">
      <rect width="432" height="32" rx="8" fill="#030A17" stroke="#164E63" stroke-width="1"/>
      <text x="14" y="20" fill="#67E8F9" font-family="Consolas, monospace" font-size="11" font-weight="700">1. e4 c5  2. Nf3 d6  3. d4 cxd4  4. Nxd4 Nf6  5. Nc3 a6</text>
      <circle cx="414" cy="16" r="4" fill="#22C55E" filter="url(#chessGlow)">
        <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Right Side: Animated Cyber Chessboard (8x8 Grid = 224x224 px) -->
  <g transform="translate(740, 28)">
    <!-- Board Base Frame -->
    <rect x="-8" y="-8" width="240" height="240" rx="14" fill="#030917" stroke="#164E63" stroke-width="1.5"/>

    <!-- 64 Board Squares -->
    <g clip-path="url(#boardClip)">
      <!-- Alternating Rows -->
      <!-- Row 1 -->
      <rect x="0" y="0" width="28" height="28" fill="#0B1A30"/><rect x="28" y="0" width="28" height="28" fill="#050E1C"/><rect x="56" y="0" width="28" height="28" fill="#0B1A30"/><rect x="84" y="0" width="28" height="28" fill="#050E1C"/><rect x="112" y="0" width="28" height="28" fill="#0B1A30"/><rect x="140" y="0" width="28" height="28" fill="#050E1C"/><rect x="168" y="0" width="28" height="28" fill="#0B1A30"/><rect x="196" y="0" width="28" height="28" fill="#050E1C"/>
      <!-- Row 2 -->
      <rect x="0" y="28" width="28" height="28" fill="#050E1C"/><rect x="28" y="28" width="28" height="28" fill="#0B1A30"/><rect x="56" y="28" width="28" height="28" fill="#050E1C"/><rect x="84" y="28" width="28" height="28" fill="#0B1A30"/><rect x="112" y="28" width="28" height="28" fill="#050E1C"/><rect x="140" y="28" width="28" height="28" fill="#0B1A30"/><rect x="168" y="28" width="28" height="28" fill="#050E1C"/><rect x="196" y="28" width="28" height="28" fill="#0B1A30"/>
      <!-- Row 3 -->
      <rect x="0" y="56" width="28" height="28" fill="#0B1A30"/><rect x="28" y="56" width="28" height="28" fill="#050E1C"/><rect x="56" y="56" width="28" height="28" fill="#0B1A30"/><rect x="84" y="56" width="28" height="28" fill="#050E1C"/><rect x="112" y="56" width="28" height="28" fill="#0B1A30"/><rect x="140" y="56" width="28" height="28" fill="#050E1C"/><rect x="168" y="56" width="28" height="28" fill="#0B1A30"/><rect x="196" y="56" width="28" height="28" fill="#050E1C"/>
      <!-- Row 4 -->
      <rect x="0" y="84" width="28" height="28" fill="#050E1C"/><rect x="28" y="84" width="28" height="28" fill="#0B1A30"/><rect x="56" y="84" width="28" height="28" fill="#050E1C"/><rect x="84" y="84" width="28" height="28" fill="#0B1A30"/><rect x="112" y="84" width="28" height="28" fill="#050E1C"/><rect x="140" y="84" width="28" height="28" fill="#0B1A30"/><rect x="168" y="84" width="28" height="28" fill="#050E1C"/><rect x="196" y="84" width="28" height="28" fill="#0B1A30"/>
      <!-- Row 5 -->
      <rect x="0" y="112" width="28" height="28" fill="#0B1A30"/><rect x="28" y="112" width="28" height="28" fill="#050E1C"/><rect x="56" y="112" width="28" height="28" fill="#0B1A30"/><rect x="84" y="112" width="28" height="28" fill="#050E1C"/><rect x="112" y="112" width="28" height="28" fill="#0B1A30"/><rect x="140" y="112" width="28" height="28" fill="#050E1C"/><rect x="168" y="112" width="28" height="28" fill="#0B1A30"/><rect x="196" y="112" width="28" height="28" fill="#050E1C"/>
      <!-- Row 6 -->
      <rect x="0" y="140" width="28" height="28" fill="#050E1C"/><rect x="28" y="140" width="28" height="28" fill="#0B1A30"/><rect x="56" y="140" width="28" height="28" fill="#050E1C"/><rect x="84" y="140" width="28" height="28" fill="#0B1A30"/><rect x="112" y="140" width="28" height="28" fill="#050E1C"/><rect x="140" y="140" width="28" height="28" fill="#0B1A30"/><rect x="168" y="140" width="28" height="28" fill="#050E1C"/><rect x="196" y="140" width="28" height="28" fill="#0B1A30"/>
      <!-- Row 7 -->
      <rect x="0" y="168" width="28" height="28" fill="#0B1A30"/><rect x="28" y="168" width="28" height="28" fill="#050E1C"/><rect x="56" y="168" width="28" height="28" fill="#0B1A30"/><rect x="84" y="168" width="28" height="28" fill="#050E1C"/><rect x="112" y="168" width="28" height="28" fill="#0B1A30"/><rect x="140" y="168" width="28" height="28" fill="#050E1C"/><rect x="168" y="168" width="28" height="28" fill="#0B1A30"/><rect x="196" y="168" width="28" height="28" fill="#050E1C"/>
      <!-- Row 8 -->
      <rect x="0" y="196" width="28" height="28" fill="#050E1C"/><rect x="28" y="196" width="28" height="28" fill="#0B1A30"/><rect x="56" y="196" width="28" height="28" fill="#050E1C"/><rect x="84" y="196" width="28" height="28" fill="#0B1A30"/><rect x="112" y="196" width="28" height="28" fill="#050E1C"/><rect x="140" y="196" width="28" height="28" fill="#0B1A30"/><rect x="168" y="196" width="28" height="28" fill="#050E1C"/><rect x="196" y="196" width="28" height="28" fill="#0B1A30"/>

      <!-- Tactical Target Highlight Squares (Pulsing) -->
      <rect x="140" y="56" width="28" height="28" fill="#38BDF8" fill-opacity="0.35" stroke="#38BDF8" stroke-width="1.5">
        <animate attributeName="fill-opacity" values="0.1;0.45;0.1" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="84" y="112" width="28" height="28" fill="#22C55E" fill-opacity="0.3" stroke="#22C55E" stroke-width="1.5">
        <animate attributeName="fill-opacity" values="0.1;0.4;0.1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Static Pieces on Board -->
    <text x="14" y="22" text-anchor="middle" font-size="18" fill="#A78BFA">♜</text>
    <text x="126" y="22" text-anchor="middle" font-size="19" fill="#F8FAFC">♚</text>
    <text x="98" y="22" text-anchor="middle" font-size="19" fill="#38BDF8" filter="url(#chessGlow)">♛</text>
    <text x="70" y="218" text-anchor="middle" font-size="18" fill="#67E8F9">♟</text>
    <text x="126" y="218" text-anchor="middle" font-size="18" fill="#67E8F9">♟</text>
    <text x="182" y="218" text-anchor="middle" font-size="18" fill="#67E8F9">♟</text>

    <!-- Animated Moving Knight (Jumps in L-Shape continuously) -->
    <g>
      <text text-anchor="middle" font-size="19" fill="#38BDF8" filter="url(#chessGlow)">
        ♞
        <animateMotion path="M 42 162 L 42 106 L 70 106 L 70 50 L 98 50 L 42 162" dur="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Laser Threat Line -->
    <line x1="98" y1="22" x2="154" y2="70" stroke="#F43F5E" stroke-width="1.8" stroke-dasharray="4 6" opacity="0.8" filter="url(#chessGlow)">
      <animate attributeName="stroke-dashoffset" values="0;-40" dur="1.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Far Right: Tactical Status Widget -->
  <g transform="translate(1010, 52)">
    <rect width="222" height="176" rx="14" fill="#030A17" stroke="#164E63" stroke-width="1.2"/>
    <text x="20" y="32" fill="#38BDF8" font-family="Consolas, monospace" font-size="11" font-weight="700">STATUS: CHECKMATE THREAT</text>
    <text x="20" y="60" fill="#94A3B8" font-family="Consolas, monospace" font-size="10">» Target: f7 square</text>
    <text x="20" y="82" fill="#94A3B8" font-family="Consolas, monospace" font-size="10">» Pattern: Royal Fork</text>
    <text x="20" y="104" fill="#86EFAC" font-family="Consolas, monospace" font-size="10">» Advantage: +3.45</text>
    <text x="20" y="126" fill="#A78BFA" font-family="Consolas, monospace" font-size="10">» Initiative: White</text>
    <!-- Mini progress bar -->
    <rect x="20" y="148" width="182" height="5" rx="2.5" fill="#0F1C30"/>
    <rect x="20" y="148" width="140" height="5" rx="2.5" fill="#38BDF8" filter="url(#chessGlow)">
      <animate attributeName="width" values="100;182;100" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>